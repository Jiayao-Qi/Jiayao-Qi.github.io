summary: >-
  我研究情感与身份认同如何塑造人们在体育中的行为：从让球迷与球队紧密相连的认同感，到吸引人们投身体育行业的热爱。

about: >-
  体育是一个充满情感的行业。很多人因为热爱体育而选择在这个行业工作，很多球迷也把支持的球队当作自己的一部分。这两类人通常被分开研究，但背后有一个共同的道理，心理学称之为“社会认同”：我们是谁，有一部分来自我们所属的群体。我的研究同时关注这两类人：在体育行业工作的人，和关注体育的球迷。

tagline: "无论是买一张球票，还是接下一份工作，推动人们走进体育的，都是情感与身份认同。我的研究，要解释这一切如何发生。"

research_lead: >-
  社会认同理论贯穿我的两条研究主线。同一个视角，既能解释被某家体育机构吸引的求职者、自我认同与球队融为一体的员工，也能解释在网上捍卫品牌的球迷。

research_areas:
  - name: "组织行为"
    key: careers
    heading: "体育从业者的情感与身份认同"
    summary: >-
      热爱与身份认同如何影响体育求职者和从业者的职业吸引、情绪、幸福感与离职。
    detail:
      - >-
        热爱把人们吸引进体育行业，也决定了他们入职之后的处境。过去二十年里，关于热爱的研究迅速增长，但发表在体育管理期刊上的只有寥寥数篇，一个建立在热爱之上的行业，因此几乎缺乏实证依据。
      - >-
        我研究热爱从何而来、它如何影响求职者对潜在雇主的评估，以及入职之后热爱与身份认同如何关联情绪与幸福感。在一项发表于 Journal of Sport Management 的生理测量研究中，理想雇主哪怕只发生细微变化，求职者的生理唤醒水平就明显下降，而他们口头上却表示无所谓。
  - name: "体育营销"
    key: fandom
    heading: "数字社群中的球迷身份认同"
    summary: >-
      球迷如何在数字社群中共同建构身份与意义，以及他们如何回应 AI 解说员、聊天机器人和个性化营销。
    detail:
      - >-
        球迷在互动中共同建构身份与意义，而数字平台让这一过程得以被大规模观察。我在不同国家的语境中描绘数字球迷群体的画像，揭示全球品牌如何在球迷讨论中被本土化；比较美国大学男篮与女篮“疯狂三月”赛事中的球迷讨论；并考察球迷如何共同塑造网球大满贯赛事的品牌意义。
      - >-
        人工智能是我日益关注的方向。一项获得资助的项目研究 AI 驱动的体育营销中的“个性化与隐私悖论”，另有实验检验球迷如何回应 AI 解说员和聊天机器人。

bridge:
  heading: "当球迷与员工是同一个人"
  text: >-
    大多数体育从业者最初都是球迷。我正在发展的一条研究线探讨球队认同如何从看台延伸到职业选择与工作结果之中，它所依托的，正是贯穿这两类文献的社会认同机制。

theory: >-
  社会认同理论是这些研究的共同基础。我还参与撰写了 Theory in Sport Management: Insights and Applications（Routledge，即将出版）中关于“拓展与建构理论”（broaden-and-build theory）的章节，为研究中的积极情绪部分提供理论支撑。

methods_intro: >-
  情绪很难靠自我报告准确测量，因此我在实验室中直接测量它，并结合对大规模文本语料的计算分析，达到访谈无法企及的规模。我也开展社会实验，并用多层模型和贝叶斯模型进行分析；同时，我通过在线收集录音回答，让质性研究也能覆盖更多的参与者。
