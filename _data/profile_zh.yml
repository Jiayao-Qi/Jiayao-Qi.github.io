    home: true
  - name: "数据科学与人工智能"
    detail: "自然语言处理、主题建模、机器学习与大语言模型（Python）"
    home: true
  - name: "定量方法"
    detail: "社会实验设计，结合多层模型（如分层线性模型，HLM）与贝叶斯分析"
    home: true
  - name: "定性方法"
    detail: "一种新的语音数据收集方式：参与者在线录制口头回答，时间自由安排，让质性研究也能达到问卷调查的样本规模"
    home: true
  - name: "数据采集"
    detail: "网络爬虫与 API（Python、R）"
  - name: "语言"
    detail: "中文（母语）、英语（熟练）"
