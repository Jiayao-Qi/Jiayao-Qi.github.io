    detail: "Galvanic skin response, EEG, eye tracking, and facial expression analysis in iMotions"
    home: true
  - name: "Data science and AI"
    detail: "Natural language processing, topic modeling, machine learning, and large language models in Python"
    home: true
  - name: "Quantitative methods"
    detail: "Surveys and experiments, with multilevel modeling in R, SPSS, and HLM 8.0"
    home: true
  - name: "Qualitative methods"
    detail: "Qualitative analysis of open-ended and spoken responses in NVivo"
    home: true
