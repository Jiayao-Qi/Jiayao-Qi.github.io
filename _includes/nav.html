<header class="nav-shell">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }}, home">
      {% include mark.svg %}
      <span>{{ site.data.profile.short_name }}</span>
    </a>
    <ul class="nav-links">
      {%- for item in site.data.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
      {%- endfor %}
    </ul>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel">
      <span class="sr-only">Menu</span>
      <span class="bars" aria-hidden="true"><i></i><i></i></span>
    </button>
  </nav>
</header>
<div class="menu-panel" id="menu-panel" hidden>
  <ul>
    {%- for item in site.data.nav %}
    <li><a href="{{ item.url | relative_url }}" style="--i: {{ forloop.index0 }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
    {%- endfor %}
  </ul>
  <div class="panel-foot">
    <p class="body-6 muted">{{ site.data.profile.email }}</p>
  </div>
</div>
