{%- assign p = site.data.profile -%}
<ul class="icon-links">
  <li><a class="icon-link" href="mailto:{{ p.email }}">{% include icons/envelope-simple.svg %}<span>Email</span></a></li>
  {%- for l in p.links %}
  <li><a class="icon-link" href="{{ l.url }}" rel="me noopener" target="_blank">{% include icons/{{ l.icon }}.svg %}<span>{{ l.label }}</span><span class="sr-only"> (opens in a new tab)</span></a></li>
  {%- endfor %}
</ul>
