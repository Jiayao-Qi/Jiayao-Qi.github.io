---
layout: default
---
{%- include lang.html -%}
<div class="wrap page">
  <aside class="profile" aria-label="{{ t.about_aria }}">
    {% include profile-card.html %}
  </aside>
  <div class="page-body">
    <header class="page-head">
      {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {%- if page.lede %}<p class="lede body-3">{{ page.lede }}</p>{% endif %}
    </header>
    {{ content }}
  </div>
</div>
